<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <meta name="description" content="Mathe üben im schnellen Aufgaben-Feed.">
    <title>MathFeed</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon-96-dark.png">
    <link rel="apple-touch-icon" href="/icon-192-dark.png">
    <link rel="stylesheet" href="/vendor/katex/katex.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main id="app" aria-live="polite">
        <section id="feed-view" class="view feed-view">
            <header class="topbar">
                <div class="brand-mark" aria-label="MathFeed">M<span>F</span></div>
                <div class="daily-summary">
                    <span id="today-count">0 Aufgaben heute</span>
                    <span id="type-label" class="type-label">Mathe-Feed</span>
                </div>
                <button id="stats-open" class="icon-button" type="button" aria-label="Statistik öffnen">▥</button>
            </header>
            <section class="task-card" aria-label="Aktuelle Aufgabe">
                <div id="task-expression" class="task-expression"></div>
                <div id="answer-tiles" class="answer-tiles"></div>
            </section>
            <footer class="gesture-hint"><span>‹</span> Wische nach links für deine Statistik</footer>
        </section>

        <section id="stats-view" class="view stats-view" aria-label="Statistik" hidden>
            <header class="stats-header">
                <div>
                    <p class="eyebrow">DEIN LERNFLOW</p>
                    <h1>Statistik</h1>
                </div>
                <button id="feed-open" class="icon-button" type="button" aria-label="Zurück zum Feed">×</button>
            </header>
            <section class="stats-section week-section">
                <div class="section-heading">
                    <h2>Übungszeit</h2>
                    <span>Diese Woche</span>
                </div>
                <div id="week-chart" class="week-chart" aria-label="Übungszeit der letzten sieben Tage"></div>
            </section>
            <section class="stats-section">
                <div class="section-heading">
                    <h2>Aufgaben heute</h2>
                    <span id="stats-total">0 gelöst</span>
                </div>
                <div id="type-matrix" class="type-matrix"></div>
            </section>
            <div class="stats-footer">Deine Daten bleiben auf diesem Gerät.</div>
        </section>
        <div id="app-error" class="app-error" role="alert" hidden></div>
        <section id="fatal-error" class="fatal-error" role="alert" hidden></section>
    </main>
    <script src="/vendor/katex/katex.min.js"></script>
    <script type="module" src="/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(error => {
                    console.error('Service worker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
